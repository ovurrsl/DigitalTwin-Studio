name: dt-upstream-bump

# Daily: when pascalorg publishes a new @pascal-app/* release to npm, open (or
# refresh) a PR that moves dt/studio to it. dt-ci on that PR builds the studio
# and type-checks the EditorProps slot contract against the new version.
#
# Requires: Settings -> Actions -> General -> "Allow GitHub Actions to create and
# approve pull requests" enabled.

on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dt-upstream-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Compare pinned and published versions
        id: versions
        run: |
          pinned="$(jq -r '.dependencies["@pascal-app/editor"]' dt/studio/package.json)"
          latest="$(npm view @pascal-app/editor version)"
          echo "pinned=$pinned latest=$latest"
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - name: Bump @pascal-app/* and refresh the lockfile
        if: steps.versions.outputs.pinned != steps.versions.outputs.latest
        env:
          LATEST: ${{ steps.versions.outputs.latest }}
        run: |
          tmp="$(mktemp)"
          jq --arg v "$LATEST" '.dependencies |= with_entries(if (.key | startswith("@pascal-app/")) then .value = $v else . end)' \
            dt/studio/package.json > "$tmp"
          mv "$tmp" dt/studio/package.json
          tmp="$(mktemp)"
          jq --arg v "$LATEST" '.peerDependencies["@pascal-app/editor"] = $v' \
            dt/packages/studio-ux/package.json > "$tmp"
          mv "$tmp" dt/packages/studio-ux/package.json
          cd dt && bun install

      - name: Open or update PR
        if: steps.versions.outputs.pinned != steps.versions.outputs.latest
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.versions.outputs.latest }}
          PINNED: ${{ steps.versions.outputs.pinned }}
        run: |
          branch="dt/bump-pascal-app"
          git config user.name "dt-upstream-bump"
          git config user.email "dt-upstream-bump@users.noreply.github.com"
          git checkout -B "$branch"
          git add dt/studio/package.json dt/packages/studio-ux/package.json dt/bun.lock
          git commit -m "chore(dt): @pascal-app/* ${PINNED} -> ${LATEST}"
          git push --force-with-lease origin "$branch"
          title="chore(dt): @pascal-app/* ${PINNED} -> ${LATEST}"
          if gh pr view "$branch" --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$branch" --title "$title"
          else
            gh pr create --base main --head "$branch" --title "$title" \
              --body "Moves dt/studio to the latest published @pascal-app/* release (${LATEST}). dt-ci builds the studio and type-checks the EditorProps slot contract against it."
          fi
