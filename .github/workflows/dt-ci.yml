name: dt-ci

# Checks the DigitalTwin layer (dt/) against its own install root. Upstream CI
# (ci.yml) keeps covering the pascalorg/editor tree.

on:
  pull_request:
    # dt/** covers milestone PRs stacked on an earlier, unmerged milestone branch.
    branches: [main, 'dt/**']
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dt-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  studio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dt
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Mirrored patches match upstream
        working-directory: .
        run: bash dt/scripts/check-patches.sh
      - name: Studio dependencies match apps/editor
        working-directory: .
        run: node dt/scripts/check-upstream-drift.mjs
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run check-types
      - run: bun run test
      - name: Database migrations and RLS
        env:
          DT_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: bun run test:db
      - name: Build (includes type check)
        run: bun run build
