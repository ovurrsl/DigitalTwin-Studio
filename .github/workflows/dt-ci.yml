name: dt-ci

# Checks the DigitalTwin layer (dt/) on top of the upstream workspace. Upstream CI
# (ci.yml) keeps covering the pascalorg/editor tree.

on:
  pull_request:
    # dt/** covers milestone PRs stacked on an earlier, unmerged milestone branch.
    branches: [main, 'dt/**']
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dt-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  studio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dt
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # The studio runs on the upstream workspace, exactly like apps/editor.
      - name: Upstream install (repo root, upstream's own lockfile)
        working-directory: .
        run: bun install --frozen-lockfile
      - name: Build upstream packages apps/editor depends on
        working-directory: .
        run: bun run build --filter='editor^...'
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run check-types
      - run: bun run test
      - name: Database, RLS and auth
        env:
          DT_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: bun run test:db
      - name: Build studio
        run: bun run build
